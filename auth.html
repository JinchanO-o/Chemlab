<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign in | Chemistry Study</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pwa.css"></head>
<body><header class="site-header"><div class="site-header__inner"><div class="site-header__brand">Study Forum</div><div id="siteNavMount"></div></div></header><main id="main-content" class="container learning-page"><section class="learning-card"><h1>Account</h1><p id="authAvailability">Optional cloud sync. Local progress continues to work without an account.</p><form id="authForm" class="learning-form"><label for="authEmail">Email<input id="authEmail" type="email" required autocomplete="email"></label><label for="authPassword">Password<input id="authPassword" type="password" minlength="6" autocomplete="current-password"></label><div class="learning-actions"><button class="button" type="submit">Sign in</button><button id="signUp" class="button secondary" type="button">Sign up</button></div></form><div class="learning-actions"><button id="githubAuth" class="button secondary" type="button">Sign in with GitHub</button><button id="googleAuth" class="button secondary" type="button">Sign in with Google</button><button id="magicLink" class="button secondary" type="button">Send magic link</button><button id="resetPassword" class="button secondary" type="button">Reset password</button></div><p id="authStatus" class="calc-result" aria-live="polite"></p></section></main><script type="module" src="js/main.js"></script><script type="module" src="js/auth.js"></script></body></html>
